>16-stud clear crypt; ≥18 above stair pitch.</text><text x="1000" y="228" font-size="18" fill="#d9d8cc" >12-stud upper paths; 18-stud landings.</text><text x="1000" y="257" font-size="18" fill="#d9d8cc" >Nave: central 48 × 64 has no supports.</text><text x="85" y="834" font-size="21" fill="#dfb56c" >Ground → upper → interior → ground and ground → crypt → interior → ground are complete loops.</text><text x="85" y="871" font-size="18" fill="#8c9bad" >Jump shortcuts add speed and expression. Stairs keep depleted players and grounded companions in the game.</text></g></svg>
